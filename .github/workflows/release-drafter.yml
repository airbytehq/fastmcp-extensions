name: Release Drafter

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft_release:
    name: Draft Release
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create draft release (not ready)
        id: not-ready-draft
        uses: aaronsteers/semantic-pr-release-drafter@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          not-ready: true

      - name: Build package
        env:
          UV_DYNAMIC_VERSIONING_BYPASS: ${{ steps.not-ready-draft.outputs.resolved-version }}
        run: uv build

      - name: Attach assets and finalize draft
        uses: aaronsteers/semantic-pr-release-drafter@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Finalize the exact draft prepared above via a strongly consistent
          # point-read; version/tag/prerelease/SHA are reused from that release.
          prepared-release-id: ${{ steps.not-ready-draft.outputs.id }}
          attach-files: |
            dist/*.whl
            dist/*.tar.gz
          # Pushes to main publish immediately; manual dispatches only refresh the draft.
          publish: ${{ github.event_name == 'push' }}

      # A release published with GITHUB_TOKEN does not fire the `release: published`
      # trigger in publish.yml, so dispatch it explicitly for the new tag.
      - name: Trigger PyPI publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.not-ready-draft.outputs.tag-name }}
          VERSION: ${{ steps.not-ready-draft.outputs.resolved-version }}
        run: >
          gh workflow run publish.yml
          --ref main
          -f git_ref="$TAG"
          -f version_override="$VERSION"
          -f publish=true
